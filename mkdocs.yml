site_name: semaclust
site_description: Semantic text clustering using sentence embeddings.
site_url: https://cobanov.github.io/semaclust/
repo_url: https://github.com/cobanov/semaclust
repo_name: cobanov/semaclust

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            docstring_style: google
            members_order: source

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API reference: api.md
  - Migration from 0.1.x: migration.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
